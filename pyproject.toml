[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drpinn"
version = "0.8.2"
description = "Research prototype: DR triage and physics-based retinal hemodynamic risk mapping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22", "Pillow>=10.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
segmentation = ["torch>=2.1"]
triage = ["torch>=2.1", "torchvision>=0.16"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drpinn = ["api/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
